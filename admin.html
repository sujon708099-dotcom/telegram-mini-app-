<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Viral Link - Admin Panel</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0d0e21;
  color:#fff;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
}

.header{
  background:#17172f;
  padding:22px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #292947;
}

.logo{
  font-size:28px;
  font-weight:bold;
}

.admin{
  background:linear-gradient(90deg,#a63df0,#e82ca5);
  padding:12px 22px;
  border-radius:30px;
  font-size:18px;
}

.container{
  padding:20px;
  max-width:700px;
  margin:auto;
}

.card{
  background:#191a35;
  border:1px solid #303052;
  border-radius:20px;
  padding:20px;
  margin-bottom:20px;
}

h2{
  margin-top:0;
}

label{
  display:block;
  margin:15px 0 7px;
  color:#ccc;
}

input,select,textarea{
  width:100%;
  padding:14px;
  border:1px solid #3b3b60;
  border-radius:12px;
  background:#0f1025;
  color:#fff;
  font-size:16px;
  outline:none;
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  width:100%;
  margin-top:20px;
  padding:15px;
  border:0;
  border-radius:14px;
  background:linear-gradient(90deg,#a63df0,#e82ca5);
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.video-item{
  background:#101126;
  padding:15px;
  border-radius:14px;
  margin-top:12px;
}

.video-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:8px;
}

.small{
  color:#aaa;
  font-size:14px;
  word-break:break-all;
}

.delete{
  background:#d93656;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">🎬 Viral Link</div>
  <div class="admin">Admin</div>
</div>

<div class="container">

  <div class="card">
    <h2>➕ নতুন ভিডিও যোগ করুন</h2>

    <label>ভিডিওর নাম</label>
    <input id="title" type="text"
           placeholder="যেমন: নতুন ভাইরাল ভিডিও">

    <label>ভিডিওর ছবি URL</label>
    <input id="image" type="text"
           placeholder="https://example.com/image.jpg">

    <label>ভিডিও URL</label>
    <input id="video" type="text"
           placeholder="https://example.com/video">

    <label>ক্যাটাগরি</label>
    <select id="category">
      <option value="viral">🔥 ভাইরাল লিংক</option>
      <option value="tiktok">TikTok</option>
      <option value="facebook">Facebook</option>
      <option value="youtube">YouTube</option>
    </select>

    <button onclick="addVideo()">ভিডিও যোগ করুন</button>
  </div>

  <div class="card">
    <h2>📋 ভিডিও তালিকা</h2>
    <div id="videoList"></div>
  </div>

</div>

<script>

let videos = JSON.parse(
  localStorage.getItem("viralVideos") || "[]"
);

function addVideo(){

  const title =
    document.getElementById("title").value.trim();

  const image =
    document.getElementById("image").value.trim();

  const video =
    document.getElementById("video").value.trim();

  const category =
    document.getElementById("category").value;

  if(!title || !image || !video){

    alert("সব তথ্য পূরণ করুন!");

    return;
  }

  const newVideo = {
    id:Date.now(),
    title:title,
    image:image,
    video:video,
    category:category,
    views:0
  };

  videos.unshift(newVideo);

  localStorage.setItem(
    "viralVideos",
    JSON.stringify(videos)
  );

  document.getElementById("title").value="";
  document.getElementById("image").value="";
  document.getElementById("video").value="";

  showVideos();

  alert("ভিডিও সফলভাবে যোগ হয়েছে ✅");
}


function deleteVideo(id){

  if(!confirm("ভিডিওটি মুছে ফেলবেন?")){
    return;
  }

  videos = videos.filter(v => v.id !== id);

  localStorage.setItem(
    "viralVideos",
    JSON.stringify(videos)
  );

  showVideos();
}


function showVideos(){

  const list =
    document.getElementById("videoList");

  if(videos.length === 0){

    list.innerHTML =
      '<p style="color:#aaa">এখনো কোনো ভিডিও যোগ করা হয়নি।</p>';

    return;
  }

  list.innerHTML = videos.map(v => `

    <div class="video-item">

      <div class="video-title">
        ${escapeHTML(v.title)}
      </div>

      <div class="small">
        Category: ${escapeHTML(v.category)}
      </div>

      <div class="small">
        Views: ${v.views || 0}
      </div>

      <button
        class="delete"
        onclick="deleteVideo(${v.id})">
        🗑️ Delete
      </button>

    </div>

  `).join("");
}


function escapeHTML(text){

  return text
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


showVideos();

</script>

</body>
</html>
