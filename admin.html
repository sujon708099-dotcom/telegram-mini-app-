<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Viral Link</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#0d0e20;
    color:#fff;
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    padding-bottom:90px;
}

.header{
    height:65px;
    background:#17182d;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    position:sticky;
    top:0;
    z-index:20;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.admin{
    background:#a747ed;
    padding:9px 15px;
    border-radius:20px;
    text-decoration:none;
    color:#fff;
}

.search{
    margin:18px;
    height:48px;
    background:#191a32;
    border-radius:28px;
    display:flex;
    align-items:center;
    padding:0 18px;
    color:#999;
}

.search input{
    flex:1;
    background:none;
    border:0;
    outline:0;
    color:#fff;
    font-size:16px;
}

.search span{
    background:#9d48ed;
    width:42px;
    height:42px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
}

.tabs{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:0 18px 18px;
}

.tab{
    white-space:nowrap;
    border:1px solid #2d2f4b;
    padding:13px 24px;
    border-radius:30px;
    background:#17182d;
    color:#ccc;
    cursor:pointer;
}

.tab.active{
    background:linear-gradient(90deg,#9b45ef,#ec3c9c);
    color:white;
}

.container{
    padding:0 18px;
    max-width:700px;
    margin:auto;
}

.card{
    background:#191a31;
    border:1px solid #2e3050;
    border-radius:22px;
    overflow:hidden;
    margin-bottom:22px;
}

.thumbnail{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#25263d;
}

.thumbnail img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.play{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:65px;
    height:65px;
    border-radius:50%;
    background:#ffffff55;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
}

.like{
    position:absolute;
    right:15px;
    top:15px;
    width:48px;
    height:48px;
    border-radius:50%;
    background:#4d4d15cc;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:25px;
    cursor:pointer;
}

.info{
    padding:17px;
}

.title{
    font-size:20px;
    line-height:1.45;
    font-weight:bold;
}

.stats{
    margin-top:12px;
    color:#aaa;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:17px;
}

.unlock{
    flex:1;
    border:0;
    border-radius:14px;
    padding:15px;
    color:#fff;
    font-size:17px;
    font-weight:bold;
    background:linear-gradient(90deg,#a34bee,#e6389b);
    cursor:pointer;
}

.link{
    width:70px;
    border:0;
    border-radius:14px;
    background:#272940;
    color:#b657f5;
    font-size:28px;
    cursor:pointer;
}

.bottom{
    position:fixed;
    bottom:12px;
    left:15px;
    right:15px;
    height:72px;
    border-radius:25px;
    background:#292b40;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:50;
    box-shadow:0 5px 30px #0008;
}

.nav{
    text-align:center;
    color:#888;
    font-size:12px;
    cursor:pointer;
}

.nav-icon{
    font-size:25px;
    display:block;
    margin-bottom:3px;
}

.nav.active{
    color:#e342ae;
}

.empty{
    text-align:center;
    color:#888;
    padding:50px 10px;
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">
        🎬 Viral Link
    </div>

    <a href="admin.html" class="admin">
        Admin
    </a>

</header>


<div class="search">

    <input
        id="searchInput"
        type="text"
        placeholder="ভিডিও খুঁজুন..."
        oninput="searchVideos()">

    <span>⌕</span>

</div>


<div class="tabs">

    <div class="tab active" onclick="filterVideos('all',this)">
        All <b id="allCount">0</b>
    </div>

    <div class="tab" onclick="filterVideos('viral',this)">
        🔥 ভাইরাল লিংক
    </div>

    <div class="tab" onclick="filterVideos('tiktok',this)">
        TikTok Viral Link
    </div>

</div>


<main class="container" id="videoList"></main>


<nav class="bottom">

    <div class="nav active">
        <span class="nav-icon">⌂</span>
        হোম
    </div>

    <div class="nav">
        <span class="nav-icon">♥</span>
        পছন্দ
    </div>

    <div class="nav">
        <span class="nav-icon">▣</span>
        ভিডিও
    </div>

    <div class="nav">
        <span class="nav-icon">🔗</span>
        লিংক
    </div>

</nav>


<script>

/* =========================
   ADMIN থেকে ভিডিও নেওয়া
========================= */

let videos = JSON.parse(
    localStorage.getItem("viralVideos") || "[]"
);


/* =========================
   কোনো ভিডিও না থাকলে
========================= */

function renderVideos(){

    const box =
        document.getElementById("videoList");

    document.getElementById("allCount")
        .innerText = videos.length;

    box.innerHTML = "";

    if(videos.length === 0){

        box.innerHTML = `
            <div class="empty">
                এখনো কোনো ভিডিও যোগ করা হয়নি 😔
                <br><br>
                Admin Panel থেকে ভিডিও যোগ করুন।
            </div>
        `;

        return;
    }

    videos.forEach(video => {

        box.innerHTML += `

        <article class="card">

            <div class="thumbnail">

                <img
                    src="${video.image}"
                    onerror="this.src='https://via.placeholder.com/800x450?text=Viral+Link'"
                >

                <div
                    class="like"
                    onclick="likeVideo(${video.id})">
                    ♡
                </div>

                <div
                    class="play"
                    onclick="unlockVideo(${video.id})">
                    ▶
                </div>

            </div>


            <div class="info">

                <div class="title">
                    ${escapeHTML(video.title)}
                </div>

                <div class="stats">
                    👁 ${video.views || 0}
                </div>


                <div class="actions">

                    <button
                        class="unlock"
                        onclick="unlockVideo(${video.id})">

                        ▶ UNLOCK
                        (${video.unlock || 0}/3)

                    </button>


                    <button
                        class="link"
                        onclick="copyLink(${video.id})">

                        🔗

                    </button>

                </div>

            </div>

        </article>

        `;

    });

}


/* =========================
   UNLOCK
========================= */

function unlockVideo(id){

    const video =
        videos.find(v => v.id === id);

    if(!video) return;

    if(!video.unlock){
        video.unlock = 0;
    }

    if(video.unlock < 3){

        video.unlock++;

        saveVideos();

        renderVideos();

    }

    if(video.unlock === 3){

        if(video.video){

            window.open(
                video.video,
                "_blank"
            );

        }else{

            alert("ভিডিও URL দেওয়া হয়নি।");

        }

    }

}


/* =========================
   LINK COPY
========================= */

function copyLink(id){

    const video =
        videos.find(v => v.id === id);

    if(!video) return;

    const link =
        location.href.split("?")[0] +
        "?video=" + video.id;

    navigator.clipboard.writeText(link)
        .then(() => {
            alert("ভিডিও লিংক কপি হয়েছে ✅");
        })
        .catch(() => {
            alert("লিংক কপি করা যায়নি।");
        });

}


/* =========================
   LIKE
========================= */

function likeVideo(id){

    alert("পছন্দে যোগ হয়েছে ❤️");

}


/* =========================
   CATEGORY FILTER
========================= */

let currentCategory = "all";

function filterVideos(category,element){

    currentCategory = category;

    document
        .querySelectorAll(".tab")
        .forEach(tab => {
            tab.classList.remove("active");
        });

    element.classList.add("active");

    searchVideos();

}


/* =========================
   SEARCH
========================= */

function searchVideos(){

    const keyword =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    const box =
        document.getElementById("videoList");

    let filtered = videos.filter(video => {

        const title =
            (video.title || "")
            .toLowerCase();

        const category =
            (video.category || "")
            .toLowerCase();

        const matchSearch =
            title.includes(keyword);

        const matchCategory =
            currentCategory === "all" ||
            category === currentCategory;

        return matchSearch && matchCategory;

    });

    box.innerHTML = "";

    if(filtered.length === 0){

        box.innerHTML = `
            <div class="empty">
                কোনো ভিডিও পাওয়া যায়নি 😔
            </div>
        `;

        return;
    }

    filtered.forEach(video => {

        box.innerHTML += `

        <article class="card">

            <div class="thumbnail">

                <img
                    src="${video.image}"
                    onerror="this.src='https://via.placeholder.com/800x450?text=Viral+Link'"
                >

                <div
                    class="like"
                    onclick="likeVideo(${video.id})">
                    ♡
                </div>

                <div
                    class="play"
                    onclick="unlockVideo(${video.id})">
                    ▶
                </div>

            </div>

            <div class="info">

                <div class="title">
                    ${escapeHTML(video.title)}
                </div>

                <div class="stats">
                    👁 ${video.views || 0}
                </div>

                <div class="actions">

                    <button
                        class="unlock"
                        onclick="unlockVideo(${video.id})">

                        ▶ UNLOCK
                        (${video.unlock || 0}/3)

                    </button>

                    <button
                        class="link"
                        onclick="copyLink(${video.id})">

                        🔗

                    </button>

                </div>

            </div>

        </article>

        `;

    });

}


/* =========================
   SAVE
========================= */

function saveVideos(){

    localStorage.setItem(
        "viralVideos",
        JSON.stringify(videos)
    );

}


/* =========================
   নিরাপদ TEXT
========================= */

function escapeHTML(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================
   START
========================= */

renderVideos();

</script>

</body>
</html>
