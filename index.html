<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>SM Viral Link</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#0d0e21;
  color:#fff;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  padding-bottom:95px;
}

.header{
  height:64px;
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#17182d;
  border-bottom:1px solid #292b47;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.menu{
  font-size:28px;
  cursor:pointer;
}

.search-box{
  margin:18px 16px;
  height:52px;
  border-radius:30px;
  background:#1b1c35;
  border:1px solid #303252;
  display:flex;
  align-items:center;
  padding-left:20px;
  color:#aaa;
}

.search-box input{
  flex:1;
  height:100%;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  font-size:15px;
}

.search-icon{
  width:50px;
  height:50px;
  border-radius:50%;
  background:linear-gradient(135deg,#9d48ef,#7540e8);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
}

.tabs{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:0 16px 18px;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  flex-shrink:0;
  padding:13px 22px;
  border-radius:28px;
  border:1px solid #30314d;
  background:#17182d;
  color:#bbb;
  cursor:pointer;
}

.tab.active{
  background:linear-gradient(90deg,#a847ee,#e83d9c);
  color:#fff;
  border-color:transparent;
}

.container{
  max-width:700px;
  margin:auto;
  padding:0 14px;
}

.card{
  background:#191a31;
  border:1px solid #30314c;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:22px;
  box-shadow:0 8px 25px #0004;
}

.video-area{
  position:relative;
  background:#000;
}

.video-area video{
  width:100%;
  display:block;
  aspect-ratio:16/9;
  object-fit:cover;
}

.like{
  position:absolute;
  top:14px;
  right:14px;
  width:48px;
  height:48px;
  border-radius:50%;
  background:#575819dd;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:27px;
  cursor:pointer;
}

.like.liked{
  color:#ff4c88;
}

.info{
  padding:16px;
}

.title{
  font-size:20px;
  font-weight:bold;
  line-height:1.45;
}

.views{
  color:#999;
  margin-top:10px;
  font-size:14px;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:16px;
}

.unlock{
  flex:1;
  height:52px;
  border:0;
  border-radius:13px;
  background:linear-gradient(90deg,#a746ed,#e73d9e);
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.link-btn{
  width:70px;
  border:0;
  border-radius:13px;
  background:#292b42;
  color:#b04cf1;
  font-size:25px;
  cursor:pointer;
}

.bottom-nav{
  position:fixed;
  left:12px;
  right:12px;
  bottom:10px;
  height:72px;
  background:#292b40;
  border:1px solid #393b55;
  border-radius:25px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:200;
  box-shadow:0 8px 30px #0009;
}

.nav-item{
  text-align:center;
  color:#85879b;
  font-size:12px;
  cursor:pointer;
}

.nav-icon{
  display:block;
  font-size:26px;
  margin-bottom:3px;
}

.nav-item.active{
  color:#ed3ca5;
}

.empty{
  text-align:center;
  color:#888;
  padding:50px 10px;
}

/* ছোট স্ক্রিন */
@media(max-width:380px){
  .title{
    font-size:17px;
  }

  .tab{
    padding:11px 17px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">🎬 SM Viral Link</div>
  <div class="menu">⋮</div>
</header>


<div class="search-box">

  <input
    id="search"
    type="text"
    placeholder="ভিডিও খুঁজুন..."
    oninput="searchVideos()"
  >

  <div class="search-icon">⌕</div>

</div>


<div class="tabs">

  <div class="tab active"
       onclick="changeCategory('all',this)">
    All <span id="allCount">0</span>
  </div>

  <div class="tab"
       onclick="changeCategory('viral',this)">
    ভাইরাল লিংক <span id="viralCount">0</span>
  </div>

  <div class="tab"
       onclick="changeCategory('tiktok',this)">
    TikTok Viral Link <span id="tiktokCount">0</span>
  </div>

</div>


<main id="videoList" class="container"></main>


<nav class="bottom-nav">

  <div class="nav-item active"
       onclick="bottomNav(this)">
    <span class="nav-icon">⌂</span>
    হোম
  </div>

  <div class="nav-item"
       onclick="bottomNav(this)">
    <span class="nav-icon">♥</span>
    পছন্দ
  </div>

  <div class="nav-item"
       onclick="bottomNav(this)">
    <span class="nav-icon">▣</span>
    ভিডিও
  </div>

  <div class="nav-item"
       onclick="bottomNav(this)">
    <span class="nav-icon">🔗</span>
    লিংক
  </div>

</nav>


<script>

/* =========================
   ভিডিও ডাটা
========================= */

const videos = [

  {
    id:1,
    title:"আজকের জনপ্রিয় ভিডিও",
    category:"viral",
    video:"https://www.w3schools.com/html/mov_bbb.mp4",
    views:17,
    unlock:0
  },

  {
    id:2,
    title:"নতুন ট্রেন্ডিং ভিডিও",
    category:"tiktok",
    video:"https://www.w3schools.com/html/movie.mp4",
    views:32,
    unlock:1
  },

  {
    id:3,
    title:"আজকের ভাইরাল ভিডিও",
    category:"viral",
    video:"https://www.w3schools.com/html/mov_bbb.mp4",
    views:54,
    unlock:2
  }

];


let currentCategory = "all";


/* =========================
   ভিডিও দেখানো
========================= */

function renderVideos(list = videos){

  const box =
    document.getElementById("videoList");

  box.innerHTML = "";

  if(list.length === 0){

    box.innerHTML =
      `<div class="empty">
        কোনো ভিডিও পাওয়া যায়নি।
       </div>`;

    return;
  }


  list.forEach(video => {

    box.innerHTML += `

      <article class="card">

        <div class="video-area">

          <video
            controls
            preload="metadata"
            src="${video.video}"
            onclick="addView(${video.id})">
          </video>

          <div
            class="like"
            onclick="likeVideo(this)">
            ♡
          </div>

        </div>


        <div class="info">

          <div class="title">
            ${escapeHTML(video.title)}
          </div>

          <div class="views">
            👁 ${video.views}
          </div>


          <div class="actions">

            <button
              class="unlock"
              onclick="unlockVideo(${video.id})">

              ▶ UNLOCK (${video.unlock}/3)

            </button>


            <button
              class="link-btn"
              onclick="copyVideoLink(${video.id})">

              🔗

            </button>

          </div>

        </div>

      </article>

    `;

  });

}


/* =========================
   Unlock
========================= */

function unlockVideo(id){

  const video =
    videos.find(v => v.id === id);

  if(!video) return;


  if(video.unlock < 3){

    video.unlock++;

    renderVideos();

  }


  if(video.unlock === 3){

    alert("ভিডিওটি আনলক হয়েছে!");

  }

}


/* =========================
   View
========================= */

function addView(id){

  const video =
    videos.find(v => v.id === id);

  if(video){

    video.views++;

    renderVideos();

  }

}


/* =========================
   Like
========================= */

function likeVideo(button){

  button.classList.toggle("liked");

  button.innerHTML =
    button.classList.contains("liked")
    ? "♥"
    : "♡";

}


/* =========================
   Link Copy
========================= */

function copyVideoLink(id){

  const link =
    location.href.split("#")[0] +
    "#video-" + id;

  navigator.clipboard.writeText(link)
    .then(() => {

      alert("ভিডিও লিংক কপি হয়েছে!");

    });

}


/* =========================
   Category
========================= */

function changeCategory(category, element){

  currentCategory = category;


  document
    .querySelectorAll(".tab")
    .forEach(tab =>
      tab.classList.remove("active")
    );


  element.classList.add("active");


  if(category === "all"){

    renderVideos(videos);

  }else{

    renderVideos(
      videos.filter(v =>
        v.category === category
      )
    );

  }

}


/* =========================
   Search
========================= */

function searchVideos(){

  const text =
    document
      .getElementById("search")
      .value
      .toLowerCase();


  let result = videos.filter(video =>
    video.title
      .toLowerCase()
      .includes(text)
  );


  if(currentCategory !== "all"){

    result =
      result.filter(video =>
        video.category === currentCategory
      );

  }


  renderVideos(result);

}


/* =========================
   Bottom Navigation
========================= */

function bottomNav(element){

  document
    .querySelectorAll(".nav-item")
    .forEach(item =>
      item.classList.remove("active")
    );

  element.classList.add("active");

}


/* =========================
   নিরাপদ HTML
========================= */

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   Counter
========================= */

document.getElementById("allCount")
  .innerText = videos.length;

document.getElementById("viralCount")
  .innerText =
  videos.filter(v =>
    v.category === "viral"
  ).length;

document.getElementById("tiktokCount")
  .innerText =
  videos.filter(v =>
    v.category === "tiktok"
  ).length;


/* প্রথমবার ভিডিও দেখানো */

renderVideos();

</script>

</body>
</html>
