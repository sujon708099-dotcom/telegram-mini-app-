<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Viral Link</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0d0e20;
    color:#fff;
    font-family:Arial,sans-serif;
    padding-bottom:90px;
}

.header{
    height:65px;
    background:#17182d;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    position:sticky;
    top:0;
    z-index:20;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.admin{
    background:#a747ed;
    padding:9px 15px;
    border-radius:20px;
    text-decoration:none;
    color:#fff;
}

.search{
    margin:18px;
    height:48px;
    background:#191a32;
    border-radius:28px;
    display:flex;
    align-items:center;
    padding:0 18px;
    color:#999;
}

.search span{
    margin-left:auto;
    background:#9d48ed;
    width:42px;
    height:42px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
}

.tabs{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:0 18px 18px;
}

.tab{
    white-space:nowrap;
    border:1px solid #2d2f4b;
    padding:13px 24px;
    border-radius:30px;
    background:#17182d;
    color:#ccc;
}

.tab.active{
    background:linear-gradient(90deg,#9b45ef,#ec3c9c);
    color:white;
}

.container{
    padding:0 18px;
    max-width:700px;
    margin:auto;
}

.card{
    background:#191a31;
    border:1px solid #2e3050;
    border-radius:22px;
    overflow:hidden;
    margin-bottom:22px;
}

.thumbnail{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#25263d;
}

.thumbnail img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.play{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:65px;
    height:65px;
    border-radius:50%;
    background:#ffffff55;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
}

.like{
    position:absolute;
    right:15px;
    top:15px;
    width:48px;
    height:48px;
    border-radius:50%;
    background:#4d4d15cc;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:25px;
}

.info{
    padding:17px;
}

.title{
    font-size:20px;
    line-height:1.45;
    font-weight:bold;
}

.stats{
    margin-top:12px;
    color:#aaa;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:17px;
}

.unlock{
    flex:1;
    border:0;
    border-radius:14px;
    padding:15px;
    color:#fff;
    font-size:17px;
    font-weight:bold;
    background:linear-gradient(90deg,#a34bee,#e6389b);
}

.link{
    width:70px;
    border:0;
    border-radius:14px;
    background:#272940;
    color:#b657f5;
    font-size:28px;
}

.bottom{
    position:fixed;
    bottom:12px;
    left:15px;
    right:15px;
    height:72px;
    border-radius:25px;
    background:#292b40;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:50;
    box-shadow:0 5px 30px #0008;
}

.nav{
    text-align:center;
    color:#888;
    font-size:12px;
}

.nav-icon{
    font-size:25px;
    display:block;
    margin-bottom:3px;
}

.nav.active{
    color:#e342ae;
}

.empty{
    text-align:center;
    color:#888;
    padding:50px 10px;
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">
        🎬 Viral Link
    </div>

    <a href="admin.html" class="admin">
        Admin
    </a>

</header>


<div class="search">

    ভিডিও খুঁজুন...

    <span>⌕</span>

</div>


<div class="tabs">

    <div class="tab active">
        All <b id="allCount">0</b>
    </div>

    <div class="tab">
        🔥 ভাইরাল লিংক
    </div>

    <div class="tab">
        TikTok Viral Link
    </div>

</div>


<main class="container" id="videoList"></main>


<nav class="bottom">

    <div class="nav active">
        <span class="nav-icon">⌂</span>
        হোম
    </div>

    <div class="nav">
        <span class="nav-icon">♥</span>
        পছন্দ
    </div>

    <div class="nav">
        <span class="nav-icon">▣</span>
        ভিডিও
    </div>

    <div class="nav">
        <span class="nav-icon">🔗</span>
        লিংক
    </div>

</nav>


<script>

const videos = [

{
    id:1,
    title:"নতুন ভাইরাল ভিডিও — এখানে ভিডিওর তথ্য দেখাবে",
    image:"https://images.unsplash.com/photo-1492724441997-5dc865305da7?w=800",
    views:17,
    unlock:0
},

{
    id:2,
    title:"আজকের জনপ্রিয় ভিডিও",
    image:"https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=800",
    views:35,
    unlock:1
},

{
    id:3,
    title:"TikTok Viral Video",
    image:"https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=800",
    views:52,
    unlock:2
}

];


function renderVideos(){

    const box =
        document.getElementById("videoList");

    document.getElementById("allCount")
        .innerText = videos.length;

    box.innerHTML = "";

    videos.forEach(video => {

        box.innerHTML += `

        <article class="card">

            <div class="thumbnail">

                <img src="${video.image}">

                <div class="like">
                    ♡
                </div>

                <div class="play">
                    ▶
                </div>

            </div>


            <div class="info">

                <div class="title">
                    ${video.title}
                </div>

                <div class="stats">
                    👁 ${video.views}
                </div>


                <div class="actions">

                    <button
                        class="unlock"
                        onclick="unlockVideo(${video.id})">

                        ▶ UNLOCK
                        (${video.unlock}/3)

                    </button>


                    <button
                        class="link"
                        onclick="copyLink(${video.id})">

                        🔗

                    </button>

                </div>

            </div>

        </article>

        `;

    });

}


function unlockVideo(id){

    const video =
        videos.find(v => v.id === id);

    if(!video) return;

    if(video.unlock < 3){

        video.unlock++;

        renderVideos();

    }

    if(video.unlock === 3){

        alert("ভিডিও আনলক হয়েছে!");

        // এখানে নিজের বৈধ ভিডিও URL ব্যবহার করবেন
        // window.location.href = video.url;

    }

}


function copyLink(id){

    const link =
        location.origin + "/video/" + id;

    navigator.clipboard.writeText(link);

    alert("ভিডিও লিংক কপি হয়েছে!");

}


renderVideos();

</script>

</body>
</html>
