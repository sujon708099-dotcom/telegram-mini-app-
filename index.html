<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SM Viral Link</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#0d0e21;
 color:#fff;
 font-family:Arial,"Noto Sans Bengali",sans-serif;
 padding-bottom:100px
}
.header{
 height:65px;
 background:#17182d;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 20px;
 border-bottom:1px solid #292b47;
 position:sticky;
 top:0;
 z-index:20
}
.logo{font-size:24px;font-weight:bold}
.admin{
 background:#a946ef;
 color:white;
 text-decoration:none;
 padding:9px 15px;
 border-radius:20px
}
.search{
 margin:18px;
 height:52px;
 border-radius:30px;
 background:#191a34;
 border:1px solid #303252;
 display:flex;
 align-items:center;
 padding-left:20px
}
.search input{
 flex:1;
 height:100%;
 background:none;
 border:0;
 outline:0;
 color:white;
 font-size:16px
}
.search button{
 width:52px;
 height:52px;
 border:0;
 border-radius:50%;
 background:linear-gradient(135deg,#9c48ef,#e13c9f);
 color:white;
 font-size:25px
}
.tabs{
 display:flex;
 gap:10px;
 overflow-x:auto;
 padding:0 18px 18px
}
.tab{
 flex-shrink:0;
 padding:13px 22px;
 border-radius:28px;
 border:1px solid #30314d;
 background:#17182d;
 color:#bbb
}
.tab.active{
 background:linear-gradient(90deg,#a946ef,#e33c9e);
 color:white
}
.container{
 max-width:700px;
 margin:auto;
 padding:0 15px
}
.card{
 background:#191a31;
 border:1px solid #30314c;
 border-radius:22px;
 overflow:hidden;
 margin-bottom:22px;
 box-shadow:0 8px 25px #0005
}
.video{
 width:100%;
 display:block;
 background:#000;
 aspect-ratio:16/9
}
.info{padding:16px}
.title{
 font-size:20px;
 font-weight:bold;
 line-height:1.45
}
.views{color:#999;margin-top:10px}
.actions{
 display:flex;
 gap:10px;
 margin-top:16px
}
.unlock{
 flex:1;
 height:52px;
 border:0;
 border-radius:14px;
 background:linear-gradient(90deg,#a946ef,#e43c9e);
 color:white;
 font-size:17px;
 font-weight:bold
}
.link{
 width:70px;
 border:0;
 border-radius:14px;
 background:#292b43;
 color:#9fd4eb;
 font-size:26px
}
.bottom{
 position:fixed;
 bottom:10px;
 left:12px;
 right:12px;
 height:72px;
 background:#292b40;
 border:1px solid #3a3c56;
 border-radius:25px;
 display:flex;
 justify-content:space-around;
 align-items:center;
 z-index:30
}
.nav{
 text-align:center;
 color:#85879b;
 font-size:12px
}
.nav span{
 display:block;
 font-size:25px;
 margin-bottom:3px
}
.nav.active{color:#ec3da6}
.empty{text-align:center;padding:50px;color:#888}
</style>
</head>

<body>

<header class="header">
 <div class="logo">🎬 SM Viral Link</div>
 <a class="admin" href="admin.html">Admin</a>
</header>

<div class="search">
 <input id="search" placeholder="ভিডিও খুঁজুন...">
 <button>⌕</button>
</div>

<div class="tabs">
 <div class="tab active" data-cat="all">All <b id="all">0</b></div>
 <div class="tab" data-cat="viral">ভাইরাল লিংক <b id="viral">0</b></div>
 <div class="tab" data-cat="tiktok">TikTok Viral Link <b id="tiktok">0</b></div>
</div>

<main class="container" id="list"></main>

<nav class="bottom">
 <div class="nav active"><span>⌂</span>হোম</div>
 <div class="nav"><span>♥</span>পছন্দ</div>
 <div class="nav"><span>▣</span>ভিডিও</div>
 <div class="nav"><span>🔗</span>লিংক</div>
</nav>

<script type="module">

import {
 initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
 getFirestore,
 collection,
 getDocs,
 doc,
 updateDoc,
 increment
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   তোমার Firebase Config
========================= */

const firebaseConfig = {

 apiKey:"YOUR_API_KEY",

 authDomain:"YOUR_PROJECT.firebaseapp.com",

 projectId:"YOUR_PROJECT_ID",

 storageBucket:"YOUR_PROJECT.firebasestorage.app",

 messagingSenderId:"YOUR_SENDER_ID",

 appId:"YOUR_APP_ID"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


let videos=[];
let category="all";


/* =========================
   Load Videos
========================= */

async function loadVideos(){

 const snap =
   await getDocs(collection(db,"videos"));

 videos=[];

 snap.forEach(item=>{

   videos.push({
     id:item.id,
     ...item.data()
   });

 });

 videos.sort((a,b)=>
   (b.createdAt || 0)-(a.createdAt || 0)
 );

 updateCounters();
 render();

}


/* =========================
   Counter
========================= */

function updateCounters(){

 document.getElementById("all")
   .innerText=videos.length;

 document.getElementById("viral")
   .innerText=
   videos.filter(v=>v.category==="viral").length;

 document.getElementById("tiktok")
   .innerText=
   videos.filter(v=>v.category==="tiktok").length;

}


/* =========================
   Render
========================= */

function render(){

 const search=
   document.getElementById("search")
   .value.toLowerCase();

 let result=videos.filter(v=>

   (category==="all" ||
    v.category===category)

   &&

   String(v.title || "")
   .toLowerCase()
   .includes(search)

 );

 const list=document.getElementById("list");

 list.innerHTML="";

 if(!result.length){

   list.innerHTML=
   `<div class="empty">
      কোনো ভিডিও পাওয়া যায়নি।
    </div>`;

   return;
 }


 result.forEach(v=>{

   list.innerHTML += `

   <article class="card">

     <video
       class="video"
       controls
       preload="metadata"
       src="${v.videoUrl}"
       data-id="${v.id}">
     </video>

     <div class="info">

       <div class="title">
         ${safe(v.title)}
       </div>

       <div class="views">
         👁 ${Number(v.views || 0)}
       </div>

       <div class="actions">

         <button
           class="unlock"
           onclick="unlock('${v.id}')">

           ▶ UNLOCK (${Number(v.unlock || 0)}/3)

         </button>

         <button
           class="link"
           onclick="copyLink('${v.id}')">

           🔗

         </button>

       </div>

     </div>

   </article>

   `;

 });


 document
 .querySelectorAll(".video")
 .forEach(video=>{

   video.addEventListener("play",()=>{

     const id=video.dataset.id;

     updateDoc(
       doc(db,"videos",id),
       {views:increment(1)}
     );

   },{once:true});

 });

}


/* =========================
   Unlock Counter
========================= */

window.unlock=async function(id){

 const video=
   videos.find(v=>v.id===id);

 if(!video)return;

 let count=Number(video.unlock || 0);

 if(count<3){

   count++;

   await updateDoc(
     doc(db,"videos",id),
     {unlock:count}
   );

   video.unlock=count;

   render();

 }

 if(count===3){

   alert("ভিডিও আনলক হয়েছে!");

 }

};


/* =========================
   Copy Link
========================= */

window.copyLink=function(id){

 const url=
   location.origin+
   location.pathname+
   "?video="+id;

 navigator.clipboard
   .writeText(url)
   .then(()=>alert("লিংক কপি হয়েছে!"));

};


/* =========================
   Search
========================= */

document
.getElementById("search")
.addEventListener("input",render);


/* =========================
   Category
========================= */

document
.querySelectorAll(".tab")
.forEach(tab=>{

 tab.onclick=()=>{

   document
   .querySelectorAll(".tab")
   .forEach(x=>
     x.classList.remove("active")
   );

   tab.classList.add("active");

   category=tab.dataset.cat;

   render();

 };

});


function safe(text){

 return String(text || "")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");

}


loadVideos();

</script>

</body>
</html>
