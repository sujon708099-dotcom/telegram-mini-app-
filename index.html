<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>ভাইরাল ভিডিও</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0b0b0f;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 18px 15px 12px;
      position: sticky;
      top: 0;
      background: #0b0b0f;
      z-index: 10;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .logo span {
      color: #ff1744;
    }

    .search {
      margin-top: 15px;
      width: 100%;
      padding: 13px 16px;
      border: 1px solid #292932;
      border-radius: 14px;
      background: #17171e;
      color: white;
      outline: none;
      font-size: 15px;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 5px 15px 15px;
    }

    .category {
      white-space: nowrap;
      background: #191920;
      padding: 9px 15px;
      border-radius: 20px;
      font-size: 13px;
    }

    .category.active {
      background: #ff1744;
    }

    .title {
      padding: 5px 15px 12px;
      font-size: 20px;
    }

    .videos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 12px 80px;
    }

    .card {
      background: #15151b;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
    }

    .thumb {
      width: 100%;
      aspect-ratio: 16 / 10;
      background: linear-gradient(135deg,#24242d,#101015);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
    }

    .info {
      padding: 10px;
    }

    .name {
      font-size: 14px;
      font-weight: bold;
      line-height: 1.4;
    }

    .views {
      color: #999;
      font-size: 12px;
      margin-top: 5px;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: #15151b;
      border-top: 1px solid #292932;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    nav div {
      text-align: center;
      color: #999;
      font-size: 12px;
    }

    nav .active {
      color: #ff1744;
    }

    .icon {
      font-size: 22px;
      display: block;
      margin-bottom: 3px;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">🔥 ভাইরাল <span>ভিডিও</span></div>

  <input
    class="search"
    id="search"
    type="text"
    placeholder="ভিডিও খুঁজুন..."
  >
</header>

<div class="categories">
  <div class="category active">সব</div>
  <div class="category">🔥 ভাইরাল</div>
  <div class="category">😂 মজার</div>
  <div class="category">🎵 মিউজিক</div>
  <div class="category">⚽ খেলাধুলা</div>
  <div class="category">🎬 বিনোদন</div>
</div>

<h2 class="title">🔥 জনপ্রিয় ভিডিও</h2>

<div class="videos" id="videos">

  <div class="card" data-name="আজকের ভাইরাল ভিডিও">
    <div class="thumb">▶️</div>
    <div class="info">
      <div class="name">আজকের ভাইরাল ভিডিও</div>
      <div class="views">👁️ 12.5K views</div>
    </div>
  </div>

  <div class="card" data-name="নতুন মজার ভিডিও">
    <div class="thumb">😂</div>
    <div class="info">
      <div class="name">নতুন মজার ভিডিও</div>
      <div class="views">👁️ 8.2K views</div>
    </div>
  </div>

  <div class="card" data-name="ভাইরাল মিউজিক ভিডিও">
    <div class="thumb">🎵</div>
    <div class="info">
      <div class="name">ভাইরাল মিউজিক ভিডিও</div>
      <div class="views">👁️ 25K views</div>
    </div>
  </div>

  <div class="card" data-name="আজকের ট্রেন্ডিং">
    <div class="thumb">🔥</div>
    <div class="info">
      <div class="name">আজকের ট্রেন্ডিং</div>
      <div class="views">👁️ 31K views</div>
    </div>
  </div>

</div>

<nav>
  <div class="active">
    <span class="icon">🏠</span>
    হোম
  </div>

  <div>
    <span class="icon">🔥</span>
    ভাইরাল
  </div>

  <div>
    <span class="icon">📂</span>
    ক্যাটাগরি
  </div>

  <div>
    <span class="icon">👤</span>
    প্রোফাইল
  </div>
</nav>

<script>
  // Telegram Mini App
  const tg = window.Telegram.WebApp;

  tg.ready();
  tg.expand();

  // Search
  const search = document.getElementById("search");
  const cards = document.querySelectorAll(".card");

  search.addEventListener("input", function () {
    const value = this.value.toLowerCase();

    cards.forEach(card => {
      const name = card.dataset.name.toLowerCase();

      if (name.includes(value)) {
        card.style.display = "block";
      } else {
        card.style.display = "none";
      }
    });
  });

  // Category click
  document.querySelectorAll(".category").forEach(category => {
    category.addEventListener("click", function () {

      document.querySelectorAll(".category")
        .forEach(x => x.classList.remove("active"));

      this.classList.add("active");
    });
  });
</script>

</body>
</html>
